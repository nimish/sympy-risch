name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: lint, format, and type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          version: "0.11.29"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.29"
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q -n auto --dist worksteal

  package:
    name: build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          version: "0.11.29"
      - name: Build wheel and source distribution
        run: uv build --no-sources --out-dir build-artifacts
      - name: Install and smoke-test wheel
        shell: bash
        run: |
          artifact="$(find build-artifacts -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$artifact"
          uv venv --python 3.13 .venv-wheel
          uv pip install --python .venv-wheel/bin/python "$artifact"
          .venv-wheel/bin/python .github/scripts/smoke_installed_distribution.py
      - name: Install and smoke-test source distribution
        shell: bash
        run: |
          artifact="$(find build-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$artifact"
          uv venv --python 3.13 .venv-sdist
          uv pip install --python .venv-sdist/bin/python "$artifact"
          .venv-sdist/bin/python .github/scripts/smoke_installed_distribution.py
