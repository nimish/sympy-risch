name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: lint, format, and type
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          version: "0.11.29"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.11.29"
      - run: uv sync --locked --all-groups
      - name: Test with branch coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest -q -n auto --dist worksteal
          --cov=sympy_risch --cov-branch --cov-report=term:skip-covered
          --cov-fail-under=84
      - name: Test
        if: matrix.python-version != '3.13'
        run: uv run pytest -q -n auto --dist worksteal

  package:
    name: installed distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: .venv-wheel/bin/python
            test-sdist: true
          - os: macos-14
            python: .venv-wheel/bin/python
            test-sdist: false
          - os: windows-2022
            python: .venv-wheel/Scripts/python.exe
            test-sdist: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          version: "0.11.29"
      - name: Build wheel
        run: uv build --wheel --no-sources --out-dir build-artifacts
      - name: Install and smoke-test wheel
        shell: bash
        run: |
          artifact="$(find build-artifacts -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$artifact"
          uv venv --python 3.13 .venv-wheel
          uv pip install --python "${{ matrix.python }}" "$artifact"
          "${{ matrix.python }}" .github/scripts/smoke_installed_distribution.py
      - name: Build source distribution
        if: matrix.test-sdist
        run: uv build --sdist --no-sources --out-dir build-artifacts
      - name: Install and smoke-test source distribution
        if: matrix.test-sdist
        shell: bash
        run: |
          artifact="$(find build-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$artifact"
          uv venv --python 3.13 .venv-sdist
          uv pip install --python .venv-sdist/bin/python "$artifact"
          .venv-sdist/bin/python .github/scripts/smoke_installed_distribution.py
