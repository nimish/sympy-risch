[project]
name = "sympy-risch"
dynamic = ["version"]
description = "An upstream-oriented implementation of the Risch algorithm built directly on SymPy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-flint>=0.9.0,<0.10",
    "sympy>=1.14,<1.15",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8",
    "ruff>=0.16.1",
    "ty>=0.0.63",
]

[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sympy_risch = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "sympy_risch._version.__version__" }

[tool.pytest.ini_options]
filterwarnings = ["error"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
include = ["src", "typecheck"]
