[project]
name = "sympy-risch"
version = "0.1.0"
description = "An upstream-oriented implementation of the Risch algorithm built directly on SymPy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-flint>=0.9.0",
    "sympy>=1.14",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "ruff>=0.15.22",
    "ty>=0.0.63",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sympy_risch = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: computationally expensive stress tests",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
include = ["src"]
